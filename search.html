<head>

  <style>
    :root {
      --header-bg: rgba(197, 206, 214, 1);
      --text: rgba(0, 0, 0, 1);
      --price: #BA4444;
      --border: #E8E8E1;
      --bg: #ffffff;
      --muted: #666666;
      --max-width: 1440px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.5;
    }
    a { color: inherit; text-decoration: none; }
    img { max-width: 100%; display: block; }

    /* Header */
    .site-header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .logo img { height: 42px; width: auto; }
    .desktop-nav { display: none; gap: 28px; font-size: 14px; }
    .desktop-nav a:hover { opacity: 0.75; }
    .header-search { display: flex; max-width: 340px; flex: 1; }
    .header-search input {
      flex: 1;
      height: 40px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-right: 0;
      border-radius: 4px 0 0 4px;
      font-size: 14px;
      outline: none;
    }
    .header-search button {
      height: 40px;
      padding: 0 18px;
      background: #1a2836;
      color: #fff;
      border: 0;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-size: 14px;
    }

    @media (min-width: 768px) {
      .desktop-nav { display: flex; }
    }

    /* Main */
    main {
      max-width: var(--max-width);
      margin: 0 auto;
      padding: 36px 24px 64px;
    }
    .page-title {
      font-size: 28px;
      font-weight: 600;
      margin: 0 0 24px;
    }
    .search-form { margin-bottom: 24px; }
    .search-form .row {
      display: flex;
      max-width: 480px;
    }
    .search-form input {
      flex: 1;
      height: 46px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-right: 0;
      border-radius: 4px 0 0 4px;
      font-size: 15px;
      outline: none;
    }
    .search-form button {
      height: 46px;
      padding: 0 22px;
      background: #1a2836;
      color: #fff;
      border: 0;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
      font-size: 15px;
    }
    .result-info {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 18px;
    }

    /* Product grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }
    @media (min-width: 640px) {
      .product-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
    }
    @media (min-width: 1024px) {
      .product-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .product-card {
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      transition: box-shadow .2s, transform .2s;
    }
    .product-card:hover {
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      transform: translateY(-2px);
    }
    .product-card .img-wrap {
      position: relative;
      padding-bottom: 100%;
      background: #f8f8f8;
      overflow: hidden;
    }
    .product-card .img-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .35s;
    }
    .product-card:hover .img-wrap img { transform: scale(1.05); }
    .product-card .info { padding: 14px; display: flex; flex-direction: column; flex: 1; }
    .product-card .name {
      font-size: 14px;
      font-weight: 500;
      line-height: 1.45;
      margin: 0 0 10px;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 2.9em;
    }
    .product-card .price {
      font-size: 16px;
      font-weight: 600;
      color: var(--price);
      margin-top: auto;
    }
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 48px 0;
      font-size: 15px;
    }
    .empty a { text-decoration: underline; }

    /* Footer */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 32px 24px;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }
    .site-footer .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 20px;
      margin-bottom: 16px;
    }
    .site-footer a:hover { color: var(--text); }
  </style>

function escapeHtml(str){
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function cardHTML(p){
  var name = p.e || p.t || '';
  var price = parseFloat(p.p);
  if (isNaN(price)) price = 0;
  var priceStr = '$' + price.toFixed(price % 1 === 0 ? 0 : 2);
  return '<a class="product-card" href="' + escapeHtml(p.u) + '">' +
           '<div class="img-wrap"><img loading="lazy" src="' + escapeHtml(p.i) + '" alt="' + escapeHtml(name) + '"></div>' +
           '<div class="info">' +
             '<h2 class="name">' + escapeHtml(name) + '</h2>' +
             '<div class="price">' + priceStr + '</div>' +
           '</div>' +
         '</a>';
}
function doSearch(e){
  e.preventDefault();
  var form = e.currentTarget || e.target;
  var input = form && form.querySelector ? form.querySelector('input[name="q"]') : null;
  var q = input ? input.value.trim() : '';
  window.location.href = '/search.html?q=' + encodeURIComponent(q);
  return false;
}
function render(list){
  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var info = document.getElementById('info');
  grid.innerHTML = '';
  if (list.length === 0){
    empty.style.display = 'block';
    info.textContent = 'No matching products found.';
    return;
  }
  empty.style.display = 'none';
  info.textContent = 'Found ' + list.length + ' products';
  var html = '';
  for (var i = 0; i < list.length; i++) { html += cardHTML(list[i]); }
  grid.innerHTML = html;
}
function init(){
  var params = new URLSearchParams(window.location.search);
  var q = (params.get('q') || '').trim();
  var box = document.getElementById('q');
  var headerBox = document.getElementById('header-q');
  if (box) box.value = q;
  if (headerBox) headerBox.value = q;
  document.title = (q ? q + ' - ' : '') + 'Search - ShengPerfume';
  if (!q){
    document.getElementById('info').textContent = 'Please enter a keyword to search.';
    document.getElementById('empty').style.display = 'none';
    return;
  }
  var ql = q.toLowerCase();
  var list = PRODUCTS.filter(function(p){
    return (p.t && p.t.toLowerCase().indexOf(ql) !== -1) ||
           (p.e && p.e.toLowerCase().indexOf(ql) !== -1) ||
           (p.u && p.u.toLowerCase().indexOf(ql) !== -1);
  });
  render(list);
}
init();
