<script data-fix="gallery-fallback">
(function(){
  // The original theme expects the slick carousel plugin, which is absent in this
  // static mirror. Provide a no-op so the theme's own thumbnail/slider handlers
  // stop throwing ("Cannot read properties of undefined (reading 'slickGoTo')").
  try { if (window.jQuery && window.jQuery.fn && !window.jQuery.fn.slick) { window.jQuery.fn.slick = function(){ return this; }; } } catch(e){}
  function init(root){
    var doc = root || document;
    var containers = doc.querySelectorAll('[id^="product_detail_"], [id^="quick_product_detail_"]');
    containers.forEach(function(wrap){
      if(wrap.__galleryBound) return; wrap.__galleryBound = true;
      var slider = wrap.querySelector('.product-image .support-slick, .product-image .slick-slider');
      var track = slider ? slider.querySelector('.slick-track') : null;
      var slides = slider ? Array.prototype.slice.call(slider.querySelectorAll('.product-info__slide')) : [];
      var thumbs = wrap.querySelectorAll('.product-image__thumbs-item');
      function slideFor(idx){ for(var i=0;i<slides.length;i++){ if(!slides[i].classList.contains('slick-cloned') && slides[i].getAttribute('data-slick-index')===String(idx)) return slides[i]; } return null; }
      function show(idx){
        var target = slideFor(idx); if(!target) return;
        slides.forEach(function(s){ s.classList.add('tw-hidden'); s.classList.remove('slick-current','slick-active'); s.setAttribute('aria-hidden','true'); s.style.display='none'; });
        target.classList.remove('tw-hidden'); target.classList.add('slick-current','slick-active'); target.setAttribute('aria-hidden','false');
        target.style.display='block'; target.style.opacity='1'; target.style.transform='none'; target.style.position='relative'; target.style.left='0';
        if(track){ track.style.transform='translate3d(0,0,0)'; }
        thumbs.forEach(function(t){ t.classList.remove('slick-current'); });
        var t = wrap.querySelector('.product-image__thumbs-item[data-thumb-idx="'+idx+'"]'); if(t) t.classList.add('slick-current');
        var cnt = wrap.querySelector('.product-image-count'); if(cnt) cnt.textContent = (idx+1)+'/'+(thumbs.length);
      }
      thumbs.forEach(function(t){ t.addEventListener('click', function(e){ if(e){e.preventDefault();e.stopPropagation();} try{show(parseInt(t.getAttribute('data-thumb-idx'),10));}catch(e){} }); });
    });
  }
  function run(){ try{ init(); }catch(e){} }
  if(document.readyState!=='loading'){ run(); } else { document.addEventListener('DOMContentLoaded', run); }
  window.addEventListener('load', function(){ setTimeout(run, 300); });
  document.addEventListener('quickshop.open', function(){ setTimeout(run, 300); });
})();
</script>
